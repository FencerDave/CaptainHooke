# in the templates via {{ site.myvariable }}.

title: David [Hurt] Hooke
subtitle: "The Incoherent Musings of an Engineer in Salem, MA"
email: DSHChemE@gmail.com
site.locale: "en-US"
description: Landing Page for David Hooke (Formerly David Hurt, married 2021), Battery Engineer, Process Engineer, and Electrochemist, and personal blogs about STEM education, Crafting, History, Salem MA, and more.

# David's Description: What better way to convince the world that I am Sane, Stable, and With-the-times than to begin a Blog site in Anno Domini 2026? Well, to that I say - How about three parallel Blogs, as I have never and will never be able to live without my loves of History, of Crafts, and of course of STEM Education and the Scientific Method. 

baseurl: "" # ONLY IF THIS IS INSIDE A FOLDER IN THE MAIN REPO, e.g. /blog
url: "www.CaptainHooke.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  FencerDave

# Build settings
#theme: minimal-mistakes-jekyll
#minimal_mistakes_skin: "sunrise" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "default"
theme: jekyll-theme-hydejack
remote_theme: hydecorp/hydejack@v9.0.3

plugins:
  - jekyll-feed
  - jekyll-archives  #for organizing posts by type into top folders


